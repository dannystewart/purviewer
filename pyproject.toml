[project]
name = "purviewer"
version = "0.3.4.dev0"
description = "Audit log analyzer for Microsoft Purview"
authors = [{ name = "Danny Stewart", email = "danny@stewart.cc" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<4.0"
packages = [{ include = "purviewer", from = "src" }]
dependencies = [
    "iplooker (>=0.5.3)",
    "numpy (>=2.5.1,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "polykit (>=0.15.0)",
    "tabulate (>=0.10.0,<0.11.0)",
]

[tool.poetry.group.dev.dependencies]
iplooker = { path = "../iplooker" }
polykit = { path = "../polykit" }
ruff = ">=0.15.20"
mypy = ">=2.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
purviewer = "purviewer.main:main"
